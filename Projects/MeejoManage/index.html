        darkMode: 'class',

          extend: {

              heading: ['Montserrat', 'sans-serif'],

              primary: '#2E86DE',
              secondary: '#FF6B6B',

              background: '#F8F9FA',

    <style>
      body { font-family: 'Inter', sans-serif; background-color: #F8F9FA; color: #2D3436; }
      h1, h2, h3, h4, h5, h6, .font-heading { font-family: 'Montserrat', sans-serif; }
      input, textarea, select {
        background-color: #ffffff !important;
        color: #000000 !important;
        border: 1px solid #e2e8f0 !important;
        font-weight: 500 !important;
      }
      @media print {
        @page { margin: 0; size: auto; }
        body * { visibility: hidden; }
        #receipt-print-area, #receipt-print-area * { visibility: visible; }
        #receipt-print-area { position: absolute; left: 0; top: 0; width: 100%; }
      }
      .dark body { background-color: #1E272E; color: #ffffff; }
      .custom-scrollbar::-webkit-scrollbar { width: 4px; }
      .custom-scrollbar::-webkit-scrollbar-thumb { background-color: rgba(46, 134, 222, 0.5); border-radius: 4px; }
    </style>
